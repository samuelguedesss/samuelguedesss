<svg xmlns="http://www.w3.org/2000/svg" width="333" height="86" viewBox="0 0 333 86" role="img" aria-label="portfólio"><title>portfólio</title><style>text{text-rendering:optimizeLegibility}.enter{animation:enter .65s ease-out both}.cursor{animation:cursor 1.2s steps(2,end) infinite}.boot{stroke-dasharray:1000;animation:boot 1s ease-out both}@keyframes enter{from{transform:translateY(5px)}to{transform:translateY(0)}}@keyframes cursor{50%{opacity:.2}}@keyframes boot{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.enter,.cursor,.boot{animation:none}}</style><rect width="333" height="86" fill="#0b0e12"/><rect y="0" width="333" height="86" fill="#141619"/><path d="M0 1H333M0 85H333" stroke="#3b2d23"/><text x="20" y="52" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#dda16c">[ portfólio ]</text><path d="M1 0V86" stroke="#3b2d23"/></svg>