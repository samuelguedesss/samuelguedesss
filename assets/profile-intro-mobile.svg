<rect width="600" height="928" fill="#090b0e"/><text x="44" y="49" fill="#dfa16d" font-size="27" font-weight="400" font-family="Menlo, Consolas, monospace">[ sg. ]</text><text x="372" y="46" fill="#b8b1a9" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Software engineer</text><path d="M44 78H556" stroke="#3d3027"/><text x="44" y="182" fill="#f2eee9" font-size="72" font-weight="600" font-family="Arial, Helvetica, sans-serif">Samuel</text><text x="44" y="266" fill="#dfa16d" font-size="72" font-weight="600" font-family="Arial, Helvetica, sans-serif">Guedes.</text><circle cx="475" cy="201" r="62" fill="none" stroke="#3d3027"/><circle cx="475" cy="201" r="45.26" fill="none" stroke="#3d3027"/><circle cx="475" cy="201" r="29.759999999999998" fill="none" stroke="#3d3027"/><g class="orbit"><circle cx="475" cy="139" r="4" fill="#dfa16d"/><circle cx="475" cy="263" r="4" fill="#dfa16d"/><circle cx="475" cy="201" r="62" fill="none" stroke="none"/></g><text x="447" y="213" fill="#dfa16d" font-size="36" font-weight="400" font-family="Menlo, Consolas, monospace">{ }</text><text x="44" y="332" fill="#f2eee9" font-size="36" font-weight="600" font-family="Arial, Helvetica, sans-serif">Por trás da interface.</text><text x="44" y="377" fill="#b8b1a9" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">APIs, dados e regras de negócio.</text><text x="44" y="432" fill="#dfa16d" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">Full stack com foco em back-end</text><path d="M44 476H556" stroke="#3d3027"/><text x="44" y="531" fill="#f2eee9" font-size="32" font-weight="600" font-family="Arial, Helvetica, sans-serif">Sobre mim</text><text x="44" y="580" fill="#b8b1a9" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Conecto interfaces a regras de negócio:</text><text x="44" y="618" fill="#b8b1a9" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">quem pode acessar,