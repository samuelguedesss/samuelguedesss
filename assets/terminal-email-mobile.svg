<svg xmlns="http://www.w3.org/2000/svg" width="200" height="88" viewBox="0 0 200 88" role="img" aria-label="e-mail"><title>e-mail</title><style>text{text-rendering:optimizeLegibility}.enter{animation:enter .65s ease-out both}.cursor{animation:cursor 1.2s steps(2,end) infinite}.boot{stroke-dasharray:1000;animation:boot 1s ease-out both}@keyframes enter{from{transform:translateY(5px)}to{transform:translateY(0)}}@keyframes cursor{50%{opacity:.2}}@keyframes boot{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.enter,.cursor,.boot{animation:none}}</style><rect width="200" height="88" fill="#0b0e12"/><rect y="0" width="200" height="88" fill="#141619"/><path d="M0 1H200M0 87H200" stroke="#3b2d23"/><text x="20" y="52" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#dda16c">[ e-mail ]</text><path d="M199 0V88" stroke="#3b2d23"/></svg>